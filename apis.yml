apis:
- aid: contrast-security:rest-api
  name: Contrast TeamServer REST API
  description: >-
    REST API for interacting with Contrast TeamServer to manage applications, libraries, vulnerabilities,
    traces, servers, agents, and organization settings. Requires an API key, Authorization header formed
    as Base64(username:service_key), and the Organization ID in the request path.
  humanURL: https://api.contrastsecurity.com/
  baseURL: https://app.contrastsecurity.com/Contrast/api/ng
